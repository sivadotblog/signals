name: signals

# Daily: collect from every source, classify, commit data/, render, build, deploy to GitHub Pages.
# Deterministic: no model, sorted output, no run timestamps.
# Pushes that touch only data/ or markdown do not start a run. To rebuild a store after
# deleting data/<tech>/updates.jsonl, run this workflow by hand (Actions > signals > Run workflow).

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Collect and classify
        run: python -m signals collect

      - name: Render twice and check determinism
        run: |
          python -m signals render --out /tmp/docs1
          python -m signals render --out /tmp/docs2
          diff -r /tmp/docs1 /tmp/docs2 && echo "DETERMINISTIC: identical output"

      - name: Report (check the Other bucket here)
        run: python -m signals report --other 40

      - name: Commit data
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: daily collect"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Render site
        run: python -m signals render --out site/docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
