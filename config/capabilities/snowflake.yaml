# Snowflake capability taxonomy.
#
# Matching is first match wins, by stage: digest or release title, item title
# (`title` regexes), source tags (`tags`, exact, case-insensitive), docs links
# (`paths` prefixes), then default_capability. Within a stage, capabilities are
# tried top to bottom. Keep specific ones above generic ones.
# Tags come from the page: each release's keywords plus its changeType.
# Check the "Other" page after changes:
#   python -m signals report --tech snowflake

technology: snowflake
name: Snowflake
default_capability: other

doc_path_pattern: '^https://docs\.snowflake\.com/(?:en/)?([^?#]*)'
ignore_link_paths: []

# Snowflake says "Preview" for public preview and "General availability" for GA.
# Private preview must come before public preview, because "(Private Preview)" also ends in "Preview)".
status_rules:
  - value: ga
    match: '\bgeneral availability\b|\bgenerally available\b|\(ga\)'
  - value: private-preview
    match: '\bprivate preview\b'
  - value: public-preview
    match: '\bpublic preview\b|\(preview\)'
  - value: beta
    match: '\(beta\)|\bin beta\b'

capabilities:
  - id: drivers
    name: Clients, drivers and libraries
    description: Snowflake CLI, SnowSQL, drivers, connectors for Python, Spark and Kafka, Snowpark and Python APIs.
    title: ['\bdrivers?\b', '\bsnowsql\b', '\bsnowflake cli\b', '\bconnector for (?:python|spark|kafka)\b', '\bsnowpark (?:api|library)\b', '\bpython api\b', '\bingest (?:java )?sdk\b', '\bml python\b']
    tags: ['Client/Driver/Library Release']
    paths: ['release-notes/clients-drivers/']

  - id: openflow
    name: Openflow
    title: ['\bopenflow\b']
    tags: ['Openflow Release']
    paths: ['release-notes/openflow/', 'user-guide/data-integration/openflow/']

  - id: connectors
    name: Snowflake Connectors
    description: Native connectors for third-party applications and databases.
    title: ['\bsnowflake connector for\b', '\bzero-?copy (?:integration|connector)\b', '\bworkday\b']
    tags: ['Connector Release', 'Zerocopy Connector']
    paths: ['release-notes/connectors/', 'connectors/']

