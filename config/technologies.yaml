# Technologies on the site, in sidebar order.
# Each technology needs config/capabilities/<id>.yaml.
# Each collector entry: id (unique, stable: it is part of every record id), type, then type params.

technologies:
  - id: databricks
    name: Databricks
    collectors:
      - id: databricks-rss
        type: rss
        url: https://learn.microsoft.com/en-us/azure/databricks/feed.xml
        split_digest: true
        # One announcement with a status or a timeline lists its parts as bullets. Keep it whole.
        no_split_title: '\(beta\)|\bin beta\b|public preview|private preview|generally available|\bga\b|\bupcoming\b|behavior change'
        no_split_bullet: '\b20\d\d\b'

  - id: snowflake
    name: Snowflake
    collectors:
      # No RSS feed. The page embeds its entries as JSON (__NEXT_DATA__).
      # Query params widen the page's default filter (server and feature updates, last 30 days).
      - id: snowflake-release-notes
        type: snowflake-release-notes
        url: https://docs.snowflake.com/en/release-notes/all-release-notes?date_preset=all&change_type=all
        split_digest: true
        no_split_title: '\(general availability\)|\(preview\)|\(public preview\)|\(private preview\)|generally available|behavior change'
        no_split_bullet: '\b20\d\d\b'

  - id: mongodb
    name: MongoDB Atlas
    # No feed. Each changelog listed on docs/atlas/release-notes/ has a markdown copy (URL + .md).
    # Product-specific changelogs pass capability_hint.
    collectors:
      - id: mongodb-atlas-changelog
        type: markdown-changelog
        url: https://www.mongodb.com/docs/atlas/release-notes/changelog.md
        page_url: https://www.mongodb.com/docs/atlas/release-notes/changelog/
      - id: mongodb-stream-processing-changelog
        type: markdown-changelog
        url: https://www.mongodb.com/docs/atlas/atlas-stream-processing/changelog.md
        page_url: https://www.mongodb.com/docs/atlas/atlas-stream-processing/changelog/
        capability_hint: stream-processing
      - id: mongodb-search-changelog
        type: markdown-changelog
        url: https://www.mongodb.com/docs/atlas/search-changelog.md
        page_url: https://www.mongodb.com/docs/atlas/search-changelog/
        capability_fallback: search  # covers Search and Vector Search; rules pick vector items out
      - id: mongodb-charts-changelog
        type: markdown-changelog
        url: https://www.mongodb.com/docs/charts/release-notes.md
        page_url: https://www.mongodb.com/docs/charts/release-notes/
        capability_hint: charts

  - id: azure-postgresql
    name: Azure Database for PostgreSQL
    # Source repo (azure-databases-docs-pr) is private and the public mirror is 404.
    # The Learn page is read as markdown through Learn's public MCP endpoint (fetch tool only).
    collectors:
      - id: azure-postgresql-release-notes
        type: learn-page
        url: https://learn.microsoft.com/en-us/azure/postgresql/release-notes/release-notes
        release_level: 2
        heading_strip: '^Release:\s*'
        group_label: 'General availability|Public preview|Private preview|Preview'
        label_prefix: '^(General availability|Public preview|Private preview|Preview)\b\s*(?:of\b|:)?\s*'
        strip_text: '\s*\^\$\^|\$\^'

  - id: alloydb
    name: AlloyDB for PostgreSQL
    # Atom feed. Every Google Cloud product has one at docs.cloud.google.com/feeds/<product>-release-notes.xml.
    # One entry per date; each <h3> type heading (Feature, Change, Fixed ...) starts one change.
    # The feed keeps about the last 30 dates. Daily runs keep everything from today forward.
    collectors:
      - id: alloydb-release-notes
        type: rss
        url: https://docs.cloud.google.com/feeds/alloydb-release-notes.xml
        split_heading: h3
        label_link: 'product-launch-stages'

  - id: azure-managed-redis
    name: Azure Managed Redis
    # Learn "What's new" page through the Learn MCP endpoint. Each change is a ### heading
    # under a ## Month YYYY heading.
    collectors:
      - id: azure-managed-redis-whats-new
        type: learn-page
        url: https://learn.microsoft.com/en-us/azure/redis/whats-new
        release_level: 2
        item_level: 3

  - id: memorystore-valkey
    name: Memorystore for Valkey
    # Google Cloud Atom feed, same format as AlloyDB.
    collectors:
      - id: memorystore-valkey-release-notes
        type: rss
        url: https://docs.cloud.google.com/feeds/memorystorevalkey-release-notes.xml
        split_heading: h3
        label_link: 'product-launch-stages'
