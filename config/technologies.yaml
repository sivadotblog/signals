# Technologies on the site, in sidebar order.
# Each technology needs config/capabilities/<id>.yaml.
# Each collector entry: id (unique, stable: it is part of every record id), type, then type params.

technologies:
  - id: databricks
    name: Databricks
    collectors:
      - id: databricks-rss
        type: rss
        url: https://learn.microsoft.com/en-us/azure/databricks/feed.xml
        split_digest: true
        # One announcement with a status or a timeline lists its parts as bullets. Keep it whole.
        no_split_title: '\(beta\)|\bin beta\b|public preview|private preview|generally available|\bga\b|\bupcoming\b|behavior change'
        no_split_bullet: '\b20\d\d\b'

  - id: snowflake
    name: Snowflake
    collectors:
      # No RSS feed. The page embeds its entries as JSON (__NEXT_DATA__).
      # Query params widen the page's default filter (server and feature updates, last 30 days).
      - id: snowflake-release-notes
        type: snowflake-release-notes
        url: https://docs.snowflake.com/en/release-notes/all-release-notes?changeType=all&datePreset=all
        split_digest: true
        no_split_title: '\(general availability\)|\(preview\)|\(public preview\)|\(private preview\)|generally available|behavior change'
        no_split_bullet: '\b20\d\d\b'
